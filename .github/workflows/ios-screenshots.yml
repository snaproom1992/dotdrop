name: iOS screenshots

# 毎 push では回さない（macOS のランナーは10倍課金）。走らせ方は2つ。
#   1. Actions のページから手で（Run workflow）
#   2. コミットメッセージに [shots] と書いて push する
on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  shots:
    # [shots] と書いたときだけ。手で起動したときは常に走る
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[shots]')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Take screenshots
        run: ios/tools/shots.sh shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            shots/*.png
            shots/*.mov
          if-no-files-found: error
      # 撮ったものを shots-latest ブランチに置く（毎回まるごと差し替え）。
      # Actions のアーティファクトは置き場所が別サーバーで、ここから取りに行けないため。
      - name: Publish to shots-latest
        run: |
          cd shots
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "撮影 ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/shots-latest
