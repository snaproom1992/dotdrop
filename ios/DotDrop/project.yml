name: DotDrop
options:
  bundleIdPrefix: com.dotdrop
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIStatusBarHidden: YES
    INFOPLIST_KEY_CFBundleDisplayName: DOT DROP
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  DotDropEngine:
    path: ../DotDropEngine
targets:
  DotDrop:
    type: application
    platform: iOS
    sources:
      - path: App
        includes:
          - "**/*.swift"
    resources:
      - path: Resources
    dependencies:
      - package: DotDropEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dotdrop.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
